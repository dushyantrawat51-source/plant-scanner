<!DOCTYPE html>
<html>

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Plant Health Scanner</title>

<style>

body{

    margin:0;
    padding:20px;

    font-family:Arial,sans-serif;

    background:#dff5df;

    text-align:center;

    min-height:100vh;
}

.schoolBanner{

    background:#1b5e20;

    color:white;

    font-size:42px;

    font-weight:bold;

    padding:15px;

    border-radius:15px;

    margin-bottom:15px;

    box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.project{

    color:#006400;

    font-size:38px;

    font-weight:bold;

    margin-bottom:10px;
}

.tagline{

    font-size:22px;

    font-weight:bold;

    color:#333;

    margin-bottom:20px;
}

.container{

    background:white;

    max-width:900px;

    margin:auto;

    padding:30px;

    border-radius:20px;

    box-shadow:0 0 25px rgba(0,0,0,0.2);
}

input[type=file]{

    font-size:18px;
}

button{

    background:#2e7d32;

    color:white;

    border:none;

    padding:15px 30px;

    border-radius:10px;

    cursor:pointer;

    font-size:24px;

    font-weight:bold;
}

button:hover{

    background:#1b5e20;
}

#preview{

    max-width:500px;

    max-height:400px;

    border-radius:15px;

    margin-top:20px;

    border:3px solid #ccc;
}

#result{

    margin-top:20px;

    background:#f5f5f5;

    padding:20px;

    border-radius:15px;

    text-align:left;

    font-size:20px;
}

.footer{

    margin-top:20px;

    font-size:18px;

    font-weight:bold;
}

</style>

</head>

<body>

<div class="schoolBanner">

🏫 ALPINE PUBLIC SCHOOL, KHURJA

</div>

<div class="project">

🌱 AI PLANT HEALTH SCANNER

</div>

<div class="tagline">

Identify Plants • Detect Health • Suggest Remedies

</div>

<div class="container">

<input
type="file"
id="imageInput"
accept="image/*"
capture="environment">

<br><br>

<button onclick="scanPlant()">

📷 Scan Leaf

</button>

<br><br>

<img id="preview">

<div id="result">

🌿 Upload a leaf image and click Scan Leaf.

</div>

</div>

<div class="footer">

Developed by Alpine Public School Students

</div>

<script>

async function scanPlant(){

    const fileInput =
    document.getElementById(
        "imageInput"
    );

    const file =
    fileInput.files[0];

    if(!file){

        alert(
        "Please select a leaf image first."
        );

        return;
    }

    document
    .getElementById("preview")
    .src =
    URL.createObjectURL(file);

    const formData =
    new FormData();

    formData.append(
        "image",
        file
    );

    try{

        const response =
        await fetch(
            "https://plant-scanner-bup2.onrender.com/identify",
            {
                method:"POST",
                body:formData
            }
        );

const data = await response.json();

result.innerHTML = `
    <h3>🌿 Scan Result</h3>
    <p><strong>Plant Name:</strong> ${data.plant_name || "Unknown"}</p>
    <p><strong>Health Status:</strong> ${data.health || "Unknown"}</p>
    <p><strong>Disease:</strong> ${data.disease || "None"}</p>
    <p><strong>Remedy:</strong> ${data.remedy || "No remedy available"}</p>
`;
} catch (err) {
        console.error(err);
        document.getElementById("result").innerText = "An error occurred while scanning. Please try again.";
    }
</script>

</body>
</html>
