<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Plant Scanner</title>

<style>
body{
    font-family:Arial,sans-serif;
    background:#e8f5e9;
    text-align:center;
    padding:20px;
}

.container{
    background:white;
    max-width:600px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

button{
    background:green;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
}

img{
    max-width:100%;
    margin-top:15px;
    border-radius:10px;
}

#result{
    margin-top:20px;
    text-align:left;
    white-space:pre-wrap;
    word-wrap:break-word;
    background:#f5f5f5;
    padding:10px;
    border-radius:10px;
}
</style>

</head>
<body>

<div class="container">

<h1>🌱 AI Plant Scanner</h1>

<input
type="file"
id="imageInput"
accept="image/*"
capture="environment">

<br><br>

<button onclick="scanPlant()">
Scan Leaf
</button>

<br><br>

<img id="preview">

<div id="result">
Waiting...
</div>

</div>

<script>

const API_KEY = "2b10nkbz8latbwRlOULHyhvRO";

async function scanPlant() {

    const fileInput =
        document.getElementById("imageInput");

    const file =
        fileInput.files[0];

    if (!file) {
        alert("Please select a leaf image.");
        return;
    }

    document.getElementById("preview").src =
        URL.createObjectURL(file);

    const formData = new FormData();

    formData.append("images", file);

    try {

        const response = await fetch(
            "http://192.168.0.187:5001/identify",
            {
                method: "POST",
                body: formData
            }
        );

        const responseText =
            await response.text();

        console.log("STATUS:", response.status);
        console.log("RESPONSE:", responseText);

        document.getElementById("result").innerHTML =
`
<b>Status:</b> ${response.status}

<b>Response:</b>

${responseText}
`;

    }
    catch(error){

        console.error(error);

        document.getElementById("result").innerHTML =
`
ERROR:

${error}
`;

    }

}

</script>

</body>
</html>
