<!DOCTYPE html>
<html>
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Plant Scanner</title>

<style>

body{
    font-family:Arial,sans-serif;
    background:#e8f5e9;
    text-align:center;
    padding:20px;
}

.container{
    background:white;
    max-width:600px;
    margin:auto;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 10px rgba(0,0,0,0.2);
}

h1{
    color:green;
}

button{
    background:green;
    color:white;
    border:none;
    padding:12px 20px;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

img{
    max-width:100%;
    margin-top:20px;
    border-radius:10px;
}

#result{
    margin-top:20px;
    background:#f5f5f5;
    padding:15px;
    border-radius:10px;
    text-align:left;
}

</style>

</head>

<body>

<div class="container">

<h1>🌱 AI Plant Scanner</h1>

<input
type="file"
id="imageInput"
accept="image/*"
capture="environment">

<br><br>

<button onclick="scanPlant()">
Scan Leaf
</button>

<br><br>

<img id="preview">

<div id="result">

Waiting for image...

</div>

</div>

<script>

async function scanPlant() {

    const fileInput =
        document.getElementById("imageInput");

    const file =
        fileInput.files[0];

    if (!file) {

        alert(
            "Please select a leaf image first."
        );

        return;
    }

    document.getElementById("preview").src =
        URL.createObjectURL(file);

    const formData =
        new FormData();

    formData.append(
        "image",
        file
    );

    try {

        const response =
            await fetch(
                "http://192.168.0.187:5001/identify",
                {
                    method: "POST",
                    body: formData
                }
            );

        const data =
            await response.json();

        console.log(data);

        if (
            data.results &&
            data.results.length > 0
        ) {

            const plant =
                data.results[0];

            const plantName =
                plant.species
                .scientificNameWithoutAuthor;

            const confidence =
                (plant.score * 100)
                .toFixed(2);

            document.getElementById(
                "result"
            ).innerHTML =

            `
            <h2>✅ Plant Identified</h2>

            <p>
            <b>Plant Name:</b>
            ${plantName}
            </p>

            <p>
            <b>Confidence:</b>
            ${confidence}%
            </p>
            `;

        }
        else {

            document.getElementById(
                "result"
            ).innerHTML =

            `
            <h2>❌ Not Identified</h2>

            <p>
            Plant could not be identified.
            </p>
            `;
        }

    }
    catch(error) {

        console.error(error);

        document.getElementById(
            "result"
        ).innerHTML =

        `
        <h2>❌ Error</h2>

        <p>
        ${error}
        </p>
        `;
    }
}

</script>

</body>
</html>
