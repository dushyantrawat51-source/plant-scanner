<!DOCTYPE html>
<html>
    
<head>

<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AI Plant Scanner</title>

<style>

body{

    font-family: Arial, sans-serif;

    text-align:center;

    padding:20px;

    min-height:100vh;

    body{

    background:

    linear-gradient(
        rgba(0,0,0,0.35),
        rgba(0,0,0,0.35)
    ),

    url("https://images.unsplash.com/photo-1441974231531-c6227db76b6e");

    background-size:cover;

    background-position:center;

    background-attachment:fixed;

    font-family:Arial,sans-serif;

    text-align:center;

    padding:20px;
}
    .school{

    font-size:42px;

    font-weight:bold;

    color:#1b5e20;

    text-shadow:
    2px 2px 8px white;

    margin-bottom:10px;
}

.project{

    color:#0b5d1e;

    font-size:36px;

    font-weight:bold;

    text-shadow:
    2px 2px 8px white;

    margin-bottom:20px;
}

}

.tagline{

    font-size:20px;

    color:#444;

    margin-bottom:20px;
}

.school{

    color:#ffffff;

    font-size:52px;

    font-weight:bold;

    text-shadow:
    3px 3px 12px black;

    margin-bottom:15px;
}

.project{

    color:white;

    font-size:30px;

    font-weight:bold;

    margin-bottom:20px;
}
    .schoolBanner{

    background:
    rgba(0,100,0,0.75);

    color:white;

    font-size:48px;

    font-weight:bold;

    padding:15px;

    border-radius:15px;

    margin-bottom:20px;

    box-shadow:
    0 0 20px rgba(
    0,
    0,
    0,
    0.4
    );
}

.container{

    background:white;

    max-width:900px;

    margin:auto;

    padding:30px;

    border-radius:20px;

    box-shadow:
    0px 0px 25px rgba(
        0,
        0,
        0,
        0.3
    );

}

button{

    background:#2e7d32;

    color:white;

    border:none;

    padding:15px 25px;

    border-radius:10px;

    cursor:pointer;

    font-size:22px;

}

button:hover{

    background:#1b5e20;

}

img{

    max-width:100%;

    border-radius:15px;

    margin-top:20px;

}

#preview{

    max-height:400px;
}

#result{

    margin-top:20px;

    background:#f5f5f5;

    padding:20px;

    border-radius:15px;

    text-align:left;

    font-size:20px;
}

</style>

</head>

<body>

<div class="schoolBanner">

🏫 ALPINE PUBLIC SCHOOL, KHURJA

</div>

<div class="project">

🌱 AI PLANT HEALTH SCANNER

</div>

<div class="tagline">

Identify Plants • Detect Health • Suggest Remedies

</div>

<div class="container">

<input
type="file"
id="imageInput"
accept="image/*"
capture="environment">

<br><br>

<button onclick="scanPlant()">
📷 Scan Leaf
</button>

<br><br>

<img id="preview">

<div id="result">

Waiting for image...

</div>

</div>
<div class="footer">

Developed by Alpine Public School Students

</div>
<script>

async function scanPlant() {

    const fileInput =
        document.getElementById(
            "imageInput"
        );

    const file =
        fileInput.files[0];

    if (!file) {

        alert(
            "Please select a leaf image first."
        );

        return;
    }

    document
    .getElementById("preview")
    .src =
    URL.createObjectURL(file);

    const formData =
        new FormData();

    formData.append(
        "image",
        file
    );

    try {

        const response =
        await fetch(
            "https://plant-scanner-bup2.onrender.com/identify",
            {
                method: "POST",
                body: formData
            }
        );

        const data =
            await response.json();

        console.log(data);

        if(
            data.results &&
            data.results.length > 0
        ){

            const plant =
                data.results[0];

            const scientificName =
                plant.species
                .scientificNameWithoutAuthor;

            let commonName =
                "Not Available";

            if(
                plant.species.commonNames &&
                plant.species.commonNames.length > 0
            ){

                commonName =
                    plant.species.commonNames[0];
            }

            const confidence =
                (
                    plant.score * 100
                ).toFixed(2);

            const health =
                data.health?.health ||
                "Unknown";

            const disease =
                data.health?.disease ||
                "Unknown";

            const healthConfidence =
                data.health?.confidence ||
                "Unknown";

            const suggestion =
                data.health?.suggestion ||
                "No suggestion available";

            document
            .getElementById("result")
            .innerHTML =

            `
            <h2 style="color:green;">
            ✅ Plant Identified
            </h2>

            <p>
            🌱 <b>Common Name:</b>
            ${commonName}
            </p>

            <p>
            🔬 <b>Scientific Name:</b>
            ${scientificName}
            </p>

            <p>
            🎯 <b>Confidence:</b>
            ${confidence}%
            </p>

            <hr>

            <h3>
            🍃 Health Analysis
            </h3>

            <p>
            <b>Health:</b>
            ${health}
            </p>

            <p>
            <b>Disease:</b>
            ${disease}
            </p>

            <p>
            <b>Health Confidence:</b>
            ${healthConfidence}
            </p>

            <p>
            <b>Suggestion:</b>
            ${suggestion}
            </p>
            `;

        }

        else{

            document
            .getElementById("result")
            .innerHTML =

            `
            <h2 style="color:red;">
            Plant Not Identified
            </h2>
            `;
        }

    }

    catch(error){

        console.error(error);

        document
        .getElementById("result")
        .innerHTML =

        `
        <h2 style="color:red;">
        Error
        </h2>

        <p>
        ${error}
        </p>
        `;
    }

}

</script>

</body>
</html>
